[package]
name = "trexd"
version = "0.1.3"
edition = "2021"
description = "A tiny reverse proxy daemon"
repository = "https://github.com/parksb/trexd"
license = "MIT"
keywords = ["proxy", "reverse-proxy", "daemon"]
categories = ["network-programming", "command-line-utilities"]
exclude = ["systemd/", ".github/", "Dockerfile"]

[dependencies]
async-trait = "^0.1"
pingora = { version = "^0.6", features = ["proxy", "openssl"] }
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
log = "^0.4"
pretty_env_logger = "^0.4"
http = "^1.3"
