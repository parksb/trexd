name: Build binary

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu
      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --target aarch64-unknown-linux-gnu --release
      - name: Prepare release files
        run: |
          mkdir release
          cp target/aarch64-unknown-linux-gnu/release/trexd release/trexd-aarch64-unknown-linux-gnu
          cp install.sh release/
          cd release || exit 1
          sha256sum trexd-aarch64-unknown-linux-gnu > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" = false ]; then
              echo "Release $TAG is already published."
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
