name: Build binary

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
          rustup target add "$TARGET"
      - name: Build binary
        run: cargo build --locked --target "$TARGET" --release
      - name: Check binary
        run: target/"$TARGET"/release/trexd --help
      - name: Prepare binary
        run: cp target/"$TARGET"/release/trexd "trexd-$TARGET"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: trexd-${{ matrix.target }}
          path: trexd-${{ matrix.target }}
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: trexd-*
          path: release
          merge-multiple: true
      - name: Prepare release files
        run: |
          cp install.sh release/
          cd release || exit 1
          sha256sum trexd-*-unknown-linux-gnu > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            if [ "$draft" = false ]; then
              echo "Release $TAG is already published."
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
